# עדכונים לרכיבי הבנייה של גיטהאב.
#
# מדיניות המאגר מתירה רק רכיבים של גיטהאב עצמה, נעולים ל-commit מדויק, ולכן זה מה שנבדק כאן.
# ההצעות מגיעות כבקשת משיכה, ועוברות בדיקה ואישור ידניים כמו כל שינוי אחר.
#
# חבילות npm לא נמצאות כאן בכוונה: שדרוג של Capacitor או של רכיב התשלום נעשה פעם בשנה,
# ורק אחרי קריאה של הקוד שלהם (המדריך, סעיף 10). התראות אבטחה של Dependabot פעילות בנפרד.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
