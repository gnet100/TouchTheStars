# בניית אפליקציית האנדרואיד, בענן בלבד.
#
# רץ ידנית, בשני שלבים:
# 1. build: בונה APK לבדיקה, APK ו-AAB לא חתומים של גרסת הפרסום, ואת המניפסט המאוחד שעליו רצות
#    הבדיקות. כאן רצים npm ו-gradle עם כל הספריות שלהם, ולכן **אין כאן שום סוד**.
# 2. sign: חותם את ה-AAB (להעלאה לגוגל) ואת ה-APK של הפרסום (לבדיקה בטלפון) במפתח ההעלאה.
#    רצים כאן רק כלים של ג'אווה ושל אנדרואיד שמותקנים בשרת, בלי קוד מהמאגר ובלי ספריות.
#    הסודות שייכים לסביבה 'release', שנפתחת רק לענף main. המפתח נוצר ב-scripts/make-upload-key.py.
#
# ה-APK לבדיקה חתום במפתח הזמני של gradle, ולכן בכל בנייה הוא חתום אחרת: לפני התקנה של גרסה
# חדשה מסירים את הקודמת. גם בין ה-APK הזה לבין ה-APK החתום במפתח ההעלאה צריך להסיר.
#
# ‏versionCode הוא מספר ההרצה של התהליך הזה ועוד 1000. שינוי שם הקובץ מאפס את המונה,
# וגוגל דוחה העלאה עם מספר נמוך מקודמו, ולכן לא משנים את שמו.
#
# כל הרכיבים הם של גיטהאב עצמה ונעולים ל-commit מדויק, כפי שמדיניות המאגר דורשת.
# אימות ה-gradle wrapper נעשה מול הגיבוב הרשמי של gradle.org, ולא דרך רכיב חיצוני שחסום אצלנו.
name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22 (Capacitor 8 requires 22 or newer)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21 (Capacitor 8 needs it, and the runner defaults to 17)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the exact dependencies from the lock file, without install scripts
        run: npm ci --ignore-scripts

      - name: The CSS in the repository matches its source
        run: |
          curl -fsSL -o /tmp/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.19/tailwindcss-linux-x64
          echo "4af3198c015616ea7d6617974ec3d70d987ecc00c1ca8463b0a30fd65cc7c06e  /tmp/tailwindcss" | sha256sum -c -
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -c tailwind.config.js -i css/tailwind.css -o css/app.css --minify
          git diff --exit-code -- css/app.css

      - name: Build the app content (www)
        run: sh scripts/build-www.sh

      - name: The page carries no code inside tags, and www matches the site
        run: python3 scripts/check-web.py --www

      - name: The gradle wrapper is the one gradle.org published
        run: |
          version=$(sed -n 's/.*gradle-\([0-9.]*\)-all\.zip/\1/p' android/gradle/wrapper/gradle-wrapper.properties)
          echo "gradle wrapper $version"
          checksum=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          echo "$checksum  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Copy the app content into the native project
        run: npx --no-install cap sync android

      - name: Build the app
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 1000))
          VERSION_NAME=$(node -p "require('../package.json').version")
          export VERSION_CODE VERSION_NAME
          echo "versionCode $VERSION_CODE, versionName $VERSION_NAME"
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Check what was built
        run: python3 scripts/check-android.py

      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    env:
      # טביעת האצבע (SHA-256) של התעודה של מפתח ההעלאה. היא ציבורית, ונשמרת כאן כדי שחתימה במפתח
      # אחר, למשל אחרי החלפה בטעות של הסוד, תיכשל מיד ולא תגיע לגוגל
      UPLOAD_CERT_SHA256: '83:FF:2C:DE:CE:93:0D:1B:08:4E:C5:CF:ED:11:2F:B1:F8:CA:01:80:05:C5:38:99:42:A4:22:A7:0A:7A:12:EC'
    steps:
      - name: Download the unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-build
          path: build

      - name: Sign the bundle and the release APK with the upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "The upload key secrets are missing. Run scripts/make-upload-key.py first." >&2
            exit 1
          fi
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "java $(java -version 2>&1 | head -1), build-tools $(basename "$tools")"

          ks="$RUNNER_TEMP/upload.p12"
          trap 'rm -f "$ks" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"

          # בדיוק קובץ אחד מכל סוג (בנתיבים שבונה gradle אין רווחים)
          set -- $(find build -name app-release.aab)
          [ $# = 1 ] || { echo "expected one release bundle, found $#" >&2; exit 1; }
          aab=$1
          set -- $(find build -name app-release-unsigned.apk)
          [ $# = 1 ] || { echo "expected one release APK, found $#" >&2; exit 1; }
          apk=$1

          name="thinking-stars-v$((RUN_NUMBER + 1000))"
          mkdir -p signed
          # AAB נחתם ב-jarsigner, כמו שגוגל מתעדת להעלאה
          jarsigner -keystore "$ks" -storetype PKCS12 -storepass:env KEY_PASSWORD -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "signed/$name.aab" "$aab" upload
          # APK: קודם יישור, ואחר כך חתימה. חתימה לפני יישור נשברת
          "$tools/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias upload \
            --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "signed/$name-release.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f signed/*.idsig
          ls -l signed

      - name: The signatures are valid and made with our upload key
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          expected=$(printf '%s' "$UPLOAD_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "UPLOAD_CERT_SHA256 is not set in this workflow. Copy it from upload-cert.pem." >&2
            exit 1
          fi
          aab=$(ls signed/*.aab)
          apk=$(ls signed/*-release.apk)

          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/jar.txt"
          grep -q '^jar verified\.' "$RUNNER_TEMP/jar.txt"
          signers=$(keytool -printcert -jarfile "$aab" | grep -c 'SHA256:')
          aab_cert=$(keytool -printcert -jarfile "$aab" | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')

          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk.txt"
          grep -q '^Number of signers: 1$' "$RUNNER_TEMP/apk.txt"
          # השורה נראית אחרת לפי שיטת החתימה ("Signer #1 certificate..." או "V3.0 Signer: certificate..."),
          # ולכן אוספים את כל השורות, וכולן צריכות להיות אותה תעודה
          apk_cert=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk.txt" | sort -u)

          echo "expected $expected"
          echo "bundle   $aab_cert ($signers signer)"
          echo "apk      $apk_cert"
          [ "$signers" = 1 ] && [ "$aab_cert" = "$expected" ] && [ "$apk_cert" = "$expected" ] || {
            echo "the files were not signed with the expected upload key" >&2; exit 1; }

      - name: Upload the signed app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-signed
          path: signed/
          retention-days: 7
          if-no-files-found: error
